[workspace]
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
    "crates/app-sdk",
    "crates/apps/calculator",
    "xtask",
]
# The client only compiles to wasm, so keep it out of plain `cargo build`/`cargo run`.
default-members = ["crates/shared", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.invalid/web_desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "crates/shared" }
app-sdk = { path = "crates/app-sdk" }

# Used by `trunk build --release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
opt-level = 3
