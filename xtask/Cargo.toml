[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
shared.workspace = true

serde.workspace = true
serde_json.workspace = true

# `hash-password` hashes with the same algorithm the server verifies with, so the two
# cannot drift apart.
bcrypt = "0.17"

# Build-time only: precompressing assets and packaging served apps.
brotli = "8"
flate2 = "1"
sha2 = "0.10"
