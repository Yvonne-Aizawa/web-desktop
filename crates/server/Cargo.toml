[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared.workspace = true
# `.env` support: the shell reads its configuration from the environment, and this
# lets a file provide it without exporting anything.
dotenvy = "0.15"

serde.workspace = true
serde_json.workspace = true

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br"] }
# Streaming responses (raw images and downloads) instead of buffering whole files.
tokio-util = { version = "0.7", features = ["io"] }
# The outbound proxy. rustls so the server needs no system TLS library.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
