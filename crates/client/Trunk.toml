[tools]
# version_131 is the newest binaryen this trunk release knows about. Without this
# pinned, trunk skips wasm-opt entirely.
wasm_opt = "version_131"

[build]
target = "index.html"
dist = "dist"
filehash = true

# Precompress as part of the build, so a rebuilt bundle can never be served with a
# stale (or missing) `.br`/`.gz` sibling. No path argument: `xtask` resolves the
# shell's dist against the repository root, so this does not depend on the
# directory trunk happens to run hooks in.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--package", "xtask", "--", "precompress"]

[watch]
watch = ["index.html", "style.css", "src", "../shared/src"]

[serve]
addresses = ["127.0.0.1"]
port = 8081
open = false

# Forward API calls to the axum backend while developing. `rewrite` scopes the
# proxy to /api (without it Trunk forwards every request, including /).
[[proxy]]
backend = "http://127.0.0.1:8080/api"
rewrite = "/api"
