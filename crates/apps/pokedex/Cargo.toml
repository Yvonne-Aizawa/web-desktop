[package]
name = "pokedex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `fetch` opts into the SDK's proxy helper: pokeapi.co sends no CORS headers, so the
# request has to be made by the server.
app-sdk = { workspace = true, features = ["fetch"] }
serde.workspace = true

# Not optional: the `view!` macro emits absolute `leptos::` paths, and the
# `#[wasm_bindgen]` export needs its crate in scope.
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
