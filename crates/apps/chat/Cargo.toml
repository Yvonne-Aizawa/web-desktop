[package]
name = "chat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `ai-stream` is the point of the app: a conversation, through the server, with the
# answer arriving as it is written and a Stop button that aborts it. `fs` is how the
# conversation is kept: one JSON file per chat, in the same sandbox Files browses.
app-sdk = { workspace = true, features = ["ai-stream", "fs"] }
serde.workspace = true
# A conversation on disk is JSON, which is also the shape the server takes back.
serde_json.workspace = true

# Not optional: the `view!` macro emits absolute `leptos::` paths, and the
# `#[wasm_bindgen]` export needs its crate in scope.
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Only for the composer: reading and clearing a `<textarea>` without binding its value
# reactively, which would move the caret to the end on every keystroke. `Element` and
# `HtmlElement` are here for the scroll-to-bottom node ref.
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
] }
