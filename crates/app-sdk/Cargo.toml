[package]
name = "app-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for writing apps served to the web desktop"

[features]
default = []
# Opt in to `app_sdk::fetch`. Off by default so an app that never makes a request
# does not carry an HTTP client and JSON parsing in its bundle.
fetch = ["dep:gloo-net", "dep:serde", "dep:serde_json", "dep:shared"]
# Opt in to `app_sdk::ai`: holding a conversation with a chat model, through the
# server, so the app never holds a provider's key and never names its address.
ai = ["dep:gloo-net", "dep:serde", "dep:serde_json", "dep:shared"]
# Also read the answer as it arrives, one frame at a time. Separate from `ai` because a
# reader needs the raw response body, a promise-based read loop and a way to abort it,
# and an app that is happy to wait for the finished answer should not carry any of that.
ai-stream = [
    "ai",
    "dep:wasm-bindgen-futures",
    "web-sys/AbortSignal",
    "web-sys/ReadableStream",
    "web-sys/ReadableStreamDefaultReader",
]
# Opt in to `app_sdk::fs`: reading and writing files through the shell's file API,
# inside the same fence the Files app lives in.
fs = ["dep:gloo-net", "dep:serde", "dep:serde_json", "dep:shared"]

[dependencies]
# Only for `fetch`.
shared = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"], optional = true }
# `chat_stream` awaits the reader's promises.
wasm-bindgen-futures = { version = "0.4", optional = true }

# No `delegation` here, on purpose: see the module docs. Apps attach direct
# listeners, which keeps them invisible to the shell's delegated dispatch.
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "HtmlElement", "Storage", "Document", "Element", "CssStyleDeclaration"]
