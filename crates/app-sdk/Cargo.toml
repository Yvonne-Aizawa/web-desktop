[package]
name = "app-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDK for writing apps served to the web desktop"

[dependencies]
# No `delegation` here, on purpose: see the module docs. Apps attach direct
# listeners, which keeps them invisible to the shell's delegated dispatch.
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "HtmlElement", "Storage", "Document", "Element", "CssStyleDeclaration"]
